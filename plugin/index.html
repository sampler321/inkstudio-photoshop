<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
<!-- Library panel -->
<div id="library" class="panel">
  <div class="top">
    <input id="q" type="search" placeholder="Search brushes, packs, tags">
    <div class="tabs" id="tabs">
      <div data-tab="media" class="b on">Packs</div>
      <div data-tab="fav" class="b">Favourites</div>
      <div data-tab="recent" class="b">Recent</div>
      <div data-tab="mine" class="b">Mine</div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="list" class="list"></div>
  <div id="empty" class="empty hidden">
    <p>Choose the folder that holds your brushes. Each pack is a subfolder with .abr files.</p>
    <div id="pick" class="b">Choose brush folder</div>
  </div>
  <div id="inspect" class="inspect">
    <div id="inspHead" class="inspHead"><span class="caret">▸</span><span>Pen response</span><span id="inspName" class="inspName"></span></div>
    <div id="inspBody" class="inspBody hidden"></div>
  </div>
  <div class="foot"><span id="status"></span><div class="views" id="views"><div class="b vbtn" data-z="0" title="List">☰</div><div class="b vbtn" data-z="1" title="Gallery, two per row">▦</div><div class="b vbtn" data-z="2" title="Large">▢</div></div><div id="settings" title="Brush folder" class="b">⚙</div></div>
</div>
<!-- Rail panel -->
<div id="rail" class="panel rail">
  <div class="b tool" data-tool="paintbrushTool" title="Brush (B)">✎</div>
  <div class="b tool" data-tool="wetBrushTool" title="Wet paint (Mixer Brush): the second fader becomes Wet">≈</div>
  <div class="b tool" data-tool="smudgeTool" title="Smudge">☁</div>
  <div class="b tool" data-tool="eraserTool" title="Eraser (E)">⌫</div>
  <div class="sep"></div>
  <div id="color" class="b color" title="Colour"></div>
  <div id="recentColors" class="recentColors"></div>
  <div class="sep"></div>
  <div id="size" class="vs" title="Size"><div class="fill"></div><div class="knob"></div></div>
  <span id="sizeV" class="val"></span>
  <div id="opacity" class="vs" title="Opacity"><div class="fill"></div><div class="knob"></div></div>
  <span id="opV" class="val"></span>
  <label>Pen sends</label>
  <div id="penInputs" class="penInputs"></div>
  <label>Media</label>
  <div id="fxPaper" class="b ptog" title="Paper grain: texture shows through, less with pressure">Paper</div>
  <div id="fxWet" class="b ptog" title="Wet edges: pigment pools at the stroke edge">Wet</div>
  <div id="fxLayer" class="b ptog" title="Layering: overlapping strokes darken, like marker or glaze">Layer</div>
  <div class="sep"></div>
  <div id="undo" title="Undo" class="b">↶</div>
  <div id="redo" title="Redo" class="b">↷</div>
  <div class="sep"></div>
  <div id="impasto" class="b ptog" title="Impasto: oil-paint relief on a merged copy layer (your painting stays untouched)">Impasto</div>
</div>
<!-- Brush panel: every brush setting the pen can touch -->
<div id="brushpanel" class="panel bp">
  <div class="bpHead"><span id="bpName" class="bpName">No brush</span><div class="bpBtns"><div id="bpHelp" class="b bpTog" title="Show or hide explanations">?</div><div id="bpMode" class="b bpTog" title="Simple: only what this brush uses. All: every setting.">Simple</div><div id="bpRefresh" class="b" title="Read again from Photoshop">↻</div></div></div>
  <div id="bpBody" class="bpBody"></div>
</div>
<script src="main.js"></script>
</body>
</html>
